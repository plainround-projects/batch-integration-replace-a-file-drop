<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="t d">
<title id="t">A file drop replaced by a message flow</title>
<desc id="d">The partner file, a nightly CSV on an SFTP folder, feeds two paths. The new path is a Spring Integration flow: an inbound adapter fetches each file once, a splitter makes one message per line, a translator drops the header and turns a line into an order, and a router sends invalid lines to the dead-letter queue and valid orders to the idempotent receiver. The receiver looks the order id up in its memory, and a new order goes to a confirmed publish into the RabbitMQ broker, which records the id only after the confirm. The order service consumes the queues and inserts into the orders table with on conflict do nothing. The old path, the legacy batch loader, reads the same files into orders_batch. Reconciliation compares the two tables and appends the result to reconciliation_run.</desc>
<style>
